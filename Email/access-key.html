<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional //EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:v="urn:schemas-microsoft-com:vml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{_accountInfo.TradingName}}</title>
    <!--[if gte mso 9]>
  <xml>
    <o:OfficeDocumentSettings>
    <o:AllowPNG/>
    <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
</head>

<body>
    <table cellspacing="0" cellpading="0"
        style="width: 100%; max-width: 600px; margin: 0 auto; font-family: 'Helvetica', Montserrat, Arial, sans-serif; border: 1px solid #E4E4E4;">
        <thead>
            <tr style="width: 300px; height: 40px;">
                <td style="background: #DE1269; padding: 10px; text-align: center; width: 300px; height: 60px;">
                    <a href="https://bertoldi.com.ar/" target="_blank">
                        <img src="https://bertoldiar.myvtex.com/arquivos/logoblacobertoldi.png" alt="Bertoldi"
                            style="width: auto; height: auto;" />
                    </a>
                </td>
            </tr>
            <tr>
                <td style="text-align: center; background: #F7F7F7; padding: 40px 20px;">
                    <h3
                        style="color: #19191A; margin: 10px 0; text-transform: uppercase; font-weight: 600; font-size: 22px; line-height: 33px; letter-spacing: 1.1px;">
                        Código de acceso
                    </h3>
                </td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="padding: 35px 43px 45px;">
                    <p style="font-size: 19px; line-height: 28px; color: #0C0D12; margin-bottom: 0px;">
                        {{to.0.name}}, te damos la BIENVENIDA!
                    </p>
                    <p style="font-size: 19px; line-height: 28px; color: #0C0D12; margin-top: 0px;">
                        Recibimos tu solicitud de ingreso a<br />
                        <a href="https://www.bertoldi.com.ar/" target="_blank" rel="noopener noreferrer"
                            style="color: #1F49D6; text-decoration: none;">https://www.bertoldi.com.ar/</a><br />
                        Ingresá el siguiente código para navegar nuestra tienda online
                    </p>
                    <p
                        style="margin: 0; padding: 10px; background-color: #F1F2F5; color: #1F49D6; font-size: 48px; font-weight: 700; letter-spacing: 4.32px; text-align: center;">
                        {{aditionalData.accessKey}}
                    </p>
                    <p style="font-size: 19px; line-height: 28px; color: #0C0D12;">
                        Este método es 100% seguro
                    </p>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td style="background: #FFFFFF; text-align: center; padding: 1px; border-top: 1px solid #E9EAED;">
                    <table cellpadding="0" cellspacing="10" align="center" style="color: #fff;">
                        <tr>
                            <td>
                                <a href="https://www.kudoscommerce.com/" target="_blank"
                                    style="display: inline-block; padding-right: 37px;">
                                    <img src="https://bertoldiar.myvtex.com/arquivos/logokudos.png"
                                        alt="Desarrollado por Kudos" />
                                </a>
                            </td>
                            <td>
                                <a href="https://vtex.com/es-ar/" target="_blank" style="display: inline-block;">
                                    <img src="https://bertoldiar.myvtex.com/arquivos/logovtex.png"
                                        alt="Plataforma VTEX" />
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td
                    style="text-align: center; background: #E9EAED; padding: 0px; font-size: 12px; line-height: 28px; letter-spacing: 0.12px; font-weight: 400; color: #676F79;">
                    ©2025 Bertoldi. Todos los derechos reservados
                </td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
